<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoFit - Passport Photo Resizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>PhotoFit</h1>
    <p>Passport Photo Resizer & Compressor</p>
</header>

<main class="container">

    <section class="card">
        <h2>Photo Settings</h2>

        <label for="preset">Select Form Preset</label>
        <select id="preset">
            <option value="ssc">SSC - 50 KB</option>
            <option value="upsc">UPSC - 100 KB</option>
            <option value="neet">NEET - 200 KB</option>
            <option value="custom">Custom Settings</option>
        </select>

        <div class="info" id="presetInfo">
            <p>Dimensions: <strong id="sizeInfo">413 × 531 px</strong></p>
            <p>Maximum Size: <strong id="kbInfo">50 KB</strong></p>
        </div>

        <div id="customSettings" class="hidden">
            <label for="customWidth">Width (pixels)</label>
            <input type="number" id="customWidth" min="1" max="2000" value="413">

            <label for="customHeight">Height (pixels)</label>
            <input type="number" id="customHeight" min="1" max="2000" value="531">

            <label for="customKB">Maximum Size (KB)</label>
            <input type="number" id="customKB" min="1" max="5000" value="100">
        </div>

        <label for="format">Output Format</label>
        <select id="format">
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
        </select>

        <label for="photoInput">Upload Your Photo</label>
        <input type="file" id="photoInput" accept="image/*">

        <button id="compressBtn">Resize & Compress Photo</button>

        <p id="status"></p>
    </section>

    <section class="comparison">
        <div class="card">
            <h3>Original Photo</h3>
            <img id="originalPreview" alt="Original photo preview">
            <p id="originalSize">No photo uploaded</p>
        </div>

        <div class="card">
            <h3>Processed Photo</h3>
            <img id="resultPreview" alt="Processed photo preview">
            <p id="compressedSize">Not processed yet</p>
            <p id="dimensions"></p>
            <p id="resultStatus"></p>
            <a id="downloadBtn" class="download hidden">Download Photo</a>
        </div>
    </section>

</main>

<footer>
    <p>PhotoFit © 2026 | Simple. Smart. Fast.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
